# Relief — OpenSubsonic + Navidrome-compatible server (Workers + D1 + R2)
#
# Cloudflare Git deploy: connect repo maxplorer-lab/relief
# Root directory: leave EMPTY (this wrangler.toml is at the repo root).
# Do not connect a "Grok export" dump — that nests this folder and CF cannot find the toml.
#
# 1. Fill the three YOUR_* placeholders below (GitHub web editor is enough).
# 2. Workers → Create → Connect Git → this repo → Deploy.
# 3. Worker → Settings → Variables and Secrets → add Secrets:
#      AUTH_SECRET
#      SETUP_SECRET
# 4. D1 → Console → paste migrations/0001_init.sql
# 5. Open https://relief.<you>.workers.dev → Setup tab.

name = "relief"
main = "src/index.ts"
compatibility_date = "2026-04-28"
compatibility_flags = ["nodejs_compat"]

[vars]
SERVER_NAME = "Relief"
SERVER_VERSION = "0.2.0"
MUSIC_FOLDER_NAME = "Music"
R2_BUCKET_NAME = "resources"

[[d1_databases]]
binding = "DB"
database_name = "vazo_db"
database_id = "${VazoDatabaseId}"

[[r2_buckets]]
binding = "MUSIC"
bucket_name = "resources"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
