<!doctype html><html lang="en"><head><meta charset="utf-8"/><title>Vazo</title><style>:root{--bg:#0b0c10;--surface:#121318;--fg:#e5e3da;--fg-dim:#8f8c82;--accent:#c0a080}.brand{font-family:serif;font-style:italic;color:var(--fg)}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--fg);min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto}header{padding:18px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.06)}.nav button{font:inherit;color:var(--fg-dim);background:transparent;border:none;padding:8px 14px;border-radius:999px;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}.card{background:var(--surface);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:10px}.primary{background:var(--accent);color:#1a1008;padding:12px 20px;border-radius:999px;border:none;font-weight:600;cursor:pointer}</style></head><body><header><a href="#" class="brand">Vazo</a><nav class="nav"><button onclick="location.hash=\"setup\"">Setup</button><button onclick="location.hash=\"login\"">Sign in</button></nav></header><main id="main"><h2>Library</h2><p style="color:var(--fg-dim)">Energy restored — redeploy needed.</p><div class="grid" id="grid"></div></main><script src="/app.js"></script></body></html>
