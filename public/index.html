<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Relief</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">Relief</div>
        <nav class="nav">
          <button type="button" id="nav-library" data-view="library">Library</button>
          <button type="button" id="nav-upload" data-view="upload">Upload</button>
          <button type="button" id="nav-setup" data-view="setup">Setup</button>
          <button type="button" id="nav-scan-media">Scan media</button>
          <button type="button" id="who" class="ghost">Sign in</button>
          <button type="button" id="nav-signup" class="ghost">Sign up</button>
        </nav>
      </header>
      <main class="main" id="main"></main>
      <footer class="player">
        <div class="now">
          <img id="now-cover" alt="" />
          <div class="meta">
            <div id="now-title">Nothing playing</div>
            <div class="muted" id="now-artist">FLAC and MP3, original files</div>
          </div>
        </div>
        <div class="controls">
          <button type="button" id="prev" class="ghost" aria-label="Previous">Prev</button>
          <button type="button" id="play" class="primary" aria-label="Play">Play</button>
          <button type="button" id="next" class="ghost" aria-label="Next">Next</button>
          <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek" />
        </div>
        <audio id="audio" preload="metadata"></audio>
      </footer>
    </div>
    <script src="/app.js"></script>
    <script src="/scan.js"></script>
  </body>
</html>
